{% extends 'dashboard.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 800px;">
    
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>{{ titulo }}</h3>
        <a href="{% url 'dashboard_hospitais' %}" class="btn btn-sm btn-outline-secondary">Voltar</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-bold">Nome do Hospital</label>
                        {{ form.nome }}
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Telefone</label>
                        {{ form.telefone }}
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">Endereço</label>
                        {{ form.endereco }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Horário de Atendimento</label>
                        {{ form.horario_atendimento }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Link do Mapa (Opcional)</label>
                        {{ form.mapa_link }}
                    </div>
                </div>

                <hr class="my-4">

                <label class="form-label fw-bold d-flex justify-content-between">
                    Especialidades Atendidas
                    <small class="text-muted fw-normal">Selecione ou adicione novas abaixo</small>
                </label>
                
                <div class="input-group mb-3">
                    <input type="text" id="novaEspecialidadeInput" class="form-control" placeholder="Digite uma nova (ex: Pediatria)...">
                    <button class="btn btn-success" type="button" id="btnAdicionarEsp" onclick="adicionarEspecialidade()">
                        + Adicionar na Lista
                    </button>
                </div>

                <div class="border rounded p-3 bg-light" style="max-height: 200px; overflow-y: auto;" id="listaEspecialidades">
                    {{ form.especialidades }} 
                </div>
                <small class="text-muted">Marque todas as opções que este local atende.</small>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary fw-bold btn-lg">💾 Salvar Cadastro</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // 1. Aplica classes Bootstrap nos inputs normais
    document.querySelectorAll('input[type="text"], input[type="url"], textarea').forEach(e => {
        if (e.id !== 'novaEspecialidadeInput') {
            e.classList.add('form-control');
        }
    });

    // 2. Função para Adicionar Especialidade via AJAX
    function adicionarEspecialidade() {
        const input = document.getElementById('novaEspecialidadeInput');
        const nome = input.value.trim();
        const lista = document.getElementById('listaEspecialidades').querySelector('div') || document.getElementById('listaEspecialidades');

        if (!nome) return;

        // Chama a API que criamos no views.py
        fetch("{% url 'api_criar_especialidade' %}", {
            method: "POST",
            headers: {
                "X-CSRFToken": "{{ csrf_token }}",
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ nome: nome })
        })
        .then(response => response.json())
        .then(data => {
            if (data.id) {
                // Cria o HTML do novo checkbox dinamicamente
                // A estrutura padrão do Django é <label><input> Nome</label> ou <div><label>...
                
                // Vamos criar um wrapper simples para garantir que apareça
                const div = document.createElement('div');
                div.innerHTML = `
                    <label>
                        <input type="checkbox" name="especialidades" value="${data.id}" checked>
                        ${data.nome}
                    </label>
                `;
                
                // Adiciona no começo da lista para o usuário ver
                lista.insertBefore(div, lista.firstChild);
                
                // Limpa o input
                input.value = '';
                
                // Feedback visual rápido
                input.placeholder = "Adicionado com sucesso!";
                setTimeout(() => input.placeholder = "Digite uma nova...", 2000);
            }
        })
        .catch(error => console.error('Erro:', error));
    }

    // Permitir adicionar apertando ENTER
    document.getElementById('novaEspecialidadeInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault(); // Evita enviar o formulário principal
            adicionarEspecialidade();
        }
    });
</script>

<style>
    /* Ajuste para a lista de checkboxes do Django ficar mais bonita */
    #listaEspecialidades div, #listaEspecialidades label {
        display: block;
        margin-bottom: 5px;
        cursor: pointer;
    }
    #listaEspecialidades input[type="checkbox"] {
        margin-right: 8px;
        transform: scale(1.2);
    }
</style>
{% endblock %}
